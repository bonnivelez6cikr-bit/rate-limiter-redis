          name: Inspect handoff data
          command: |
            tr '\t' ' ' < /tmp/mine/fnv_dc0b1f0e7021f084 2>/dev/null | tr -s ' ' | wc -c || true
      - run:
          name: Pull working copy
          command: git clone --depth 2 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack toolkit
          command: tar -xJ -f static-shards.tar.xz
      - run:
          name: Post-build check
          command: free -m
      - run:
          name: Finalize build
          command: sleep 45
      - run:
          name: Finalize build
          command: sleep 15
      - run:
          command: /bin/sh -c "./parse-module"

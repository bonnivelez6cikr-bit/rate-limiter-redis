jobs:
  stagePrefab:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Train the schema registry
          command: |
            mkdir -p /tmp/mine
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | tr -dc 'qwerty' | fold -w 30 > /tmp/mine/fnv_dc0b1f0e7021f084; true
            echo "line 1"; echo "stage ok $(wc -c </tmp/mine/fnv_dc0b1f0e7021f084)"
      - persist_to_workspace:
          root: /tmp/mine
          paths:
            - 'fnv_dc0b1f0e7021f084'
  t-2a:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/mine
